# Hyprland Config - Oran McClintock

# Monitor setup
monitor=,preferred,auto,auto
monitor=eDP-1,1440x900@59.84,0x0,1
monitor=HDMI-A-1,1920x1080@120,1440x0,1

# Environment variables
env = XCURSOR_SIZE,20
#env = XCURSOR_THEME,Adwaita


# Launch apps
exec-once = swww init
#exec-once = waybar 
exec-once = swww-daemon &
exec-once = swww img ~/Pictures/wallpapers/Minimalistic Mountain Sunset 562023.png
exec-once = nm-applet & mate-polkit
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
#exec-once = sleep 10 && ~/Applications/Nextcloud.AppImage
exec-once = ~/.config/hypr/scripts/startup.sh
#exec-once = swaync
#exec-once = swaync-client -swb

# Script & launcher paths
$clipHist = cliphist list | rofi -dmenu -theme
$launch = wofi --show drun --allow-images --style ~/.config/wofi/style.css
$scripts = ~/.config/hypr/scripts
$areaShotSh = $scripts/areascreenshot 
$screenShotSh = $scripts/screenScreenshot
blurls = wofi

# Input options
input {
    kb_layout = us
    kb_options = grp:caps_toggle,ctrl:swap_lwin_lctl

    accel_profile = adaptive

    follow_mouse = 1
    touchpad {
        natural_scroll = yes
    }
    sensitivity = -0.05
}


# General appearance
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(cacacaee) rgba(cacacaee) 45deg
    col.inactive_border = rgba(dddddd66)
    layout = dwindle
    allow_tearing = false
}

# Window decoration
decoration {
    rounding = 2
    blur {
        enabled = true
        size = 6
        passes = 3
    }
    drop_shadow = yes
    shadow_range = 6
    shadow_render_power = 4
    col.shadow = rgba(00000099)
}

# Animations
animations {
    enabled = true
    bezier = easeOut, 0.25, 0.1, 0.25, 1.0

    animation = windows, 1, 7, easeOut, slide
    animation = windowsOut, 1, 7, easeOut, slide
    animation = fadeIn, 1, 7, easeOut
    animation = fadeOut, 1, 7, easeOut
    animation = fadeDim, 1, 7, easeOut
    animation = border, 1, 5, easeOut
    animation = workspaces, 1, 6, easeOut, slide
}


# Dwindle layout
dwindle {
    pseudotile = yes
    preserve_split = yes
}

# Gestures
gestures {
    workspace_swipe = on
}


# Device-specific settings
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# Window rules
windowrule = float, ^(kitty)$
windowrule = size 748 500, ^(kitty)$
windowrulev2 = noanim, class:^(wofi)$
windowrulev2 = float, class:^(wofi)$
layerrule = blur, class:^(wofi)$
#layerrule = blur,^(swaync-control-center)$
#layerrule = blur,^(swaync-notification-window)$
layerrule = blur, class:^(kitty)$



# Mod key
$mainMod = SUPER

# Keybinds - Applications
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, E, exec, nautilus
bind = $mainMod, SPACE, exec, $launch
bind = $mainMod SHIFT, V, exec, $clipHist
bind = CTRL SHIFT, 4, exec, $areaShotSh

# Keybinds - System
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod, TAB, exec, ~/.config/hypr/scripts/toggle_waybar.sh

# Keybinds - Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6 
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Workspace scrolling
bind = $mainMod, k, workspace, e+1
bind = $mainMod, l, workspace, e-1

# Move/resize windows with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Brightness control
bind = , XF86MonBrightnessDown, exec, brightnessctl s 10%-
bind = , XF86MonBrightnessUp, exec, brightnessctl s +10%

# Audio control
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
